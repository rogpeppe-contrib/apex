[package]
name = "apex-client"
version.workspace = true
edition.workspace = true
description = "apex UI client: renders a session's state with gpui and turns mouse and keys into entries"

[[bin]]
name = "apex-ui"
path = "src/main.rs"

[dependencies]
apex-core = { path = "../apex-core" }
apex-server = { path = "../apex-server" }
apex-edit = { path = "../apex-edit" }
# gpui straight from Zed's tree: the published crate lags far behind
gpui = { git = "https://github.com/zed-industries/zed", branch = "main" }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["runtime_shaders", "font-kit"] }
futures = "0.3"
# web windows: a native web view as a child of the gpui window (WEB.md §2)
wry = "0.56"
flate2 = "1"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# gpui's Linux backends: both, chosen by what the session offers
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["runtime_shaders", "font-kit", "wayland", "x11"] }
# wry's pages are WebKitGTK's, which need GTK initialised and its loop
# turned (`web::pump`)
gtk = "0.18"
# the view under wry's, for what wry does not say (editing commands, zoom)
webkit2gtk = "2.0"
# gpui's window as GDK sees it, to ask where the pointer is (`web::native_mouse`)
gdkx11 = "0.18"
# the pointer warped on gpui's own X connection (`warp::move_to`): the
# x11rb gpui already builds, with its libxcb wrapper
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "21"
objc = "0.2"
block2 = "0.6"
wry = { version = "0.56", features = ["mac-proxy"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
# Avoid pathfinder_simd's broken nightly-only aarch64 SIMD backend.
pathfinder_simd = { version = "0.5.6", features = ["pf-no-simd"] }
